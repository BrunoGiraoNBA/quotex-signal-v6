<script>

/* =====================================================
   BRUNO M1 - TESTE PROSPECTIVO V6
   Parâmetros congelados
===================================================== */

const CONFIG = {
    symbol: "EUR/USD",
    interval: "1min",
    outputsize: 200,

    emaRapidaPeriodo: 9,
    emaLentaPeriodo: 21,
    rsiPeriodo: 14,
    atrPeriodo: 14,
    mediaCorpoPeriodo: 10,
    periodoInclinacao: 3,

    callRsiMin: 52,
    callRsiMax: 68,

    putRsiMin: 32,
    putRsiMax: 48,

    distanciaMinimaATR: 0.12,
    corpoMinimoATR: 0.20,

    intervaloMinimo: 5,

    horaInicial: 10,
    horaFinal: 12,

    /*
       Início do teste:
       26/11/2026 às 10h de Brasília
    */

    inicioTeste:
        new Date("2026-11-26T10:00:00-03:00")
};


/* =====================================================
   ESTADO
===================================================== */

let chaveAPI = "";

let timerAtualizacao = null;

let ultimaVelaProcessada = null;

let indiceUltimoSinal = null;

let contadorVelas = 0;


/* =====================================================
   ELEMENTOS
===================================================== */

function elemento(id) {
    return document.getElementById(id);
}


/* =====================================================
   CONEXÃO
===================================================== */

async function conectar() {

    const campo = elemento("apiKey");

    const chave = campo.value.trim();

    if (!chave) {

        mostrarErro(
            "Digite sua API Key."
        );

        return;
    }


    chaveAPI = chave;


    /*
       A chave fica somente no navegador.
       Ela não é incluída no GitHub.
    */

    localStorage.setItem(
        "v6_twelve_api_key",
        chaveAPI
    );


    elemento("conexaoStatus").innerText =
        "Conectando...";


    elemento("conexaoStatus").style.color =
        "#91a4bd";


    await atualizarDados();


    if (timerAtualizacao) {
        clearInterval(timerAtualizacao);
    }


    /*
       Faz nova consulta a cada minuto.
    */

    timerAtualizacao = setInterval(
        atualizarDados,
        60000
    );

}


/* =====================================================
   BUSCAR CANDLES
===================================================== */

async function atualizarDados() {

    if (!chaveAPI) {
        return;
    }


    try {

        const parametros =
            new URLSearchParams({

                symbol:
                    CONFIG.symbol,

                interval:
                    CONFIG.interval,

                outputsize:
                    String(CONFIG.outputsize),

                timezone:
                    "America/Sao_Paulo",

                apikey:
                    chaveAPI

            });


        const url =
            "https://api.twelvedata.com/time_series?" +
            parametros.toString();


        const resposta =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );


        if (!resposta.ok) {

            throw new Error(
                "Erro HTTP " +
                resposta.status
            );

        }


        const dados =
            await resposta.json();


        if (
            dados.status === "error" ||
            !Array.isArray(dados.values)
        ) {

            throw new Error(
                dados.message ||
                "A API não retornou candles."
            );

        }


        /*
           A API entrega a vela mais nova primeiro.
           Invertemos para:
           vela antiga -> vela nova.
        */

        const candles =
            dados.values
            .slice()
            .reverse()
            .map(valor => ({

                datetime:
                    valor.datetime,

                open:
                    Number(valor.open),

                high:
                    Number(valor.high),

                low:
                    Number(valor.low),

                close:
                    Number(valor.close)

            }))
            .filter(candle =>

                Number.isFinite(candle.open) &&
                Number.isFinite(candle.high) &&
                Number.isFinite(candle.low) &&
                Number.isFinite(candle.close)

            );


        if (candles.length < 50) {

            throw new Error(
                "Quantidade insuficiente de candles."
            );

        }


        const velasFechadas =
            filtrarVelasFechadas(
                candles
            );


        if (velasFechadas.length < 50) {

            throw new Error(
                "Ainda não há velas fechadas suficientes."
            );

        }


        processarV6(
            velasFechadas
        );


        elemento("conexaoStatus").innerText =
            "● CONECTADO • EUR/USD M1";


        elemento("conexaoStatus").style.color =
            "#46e68b";


    }
    catch (erro) {

        mostrarErro(
            erro.message
        );

    }

}


/* =====================================================
   DATA DA VELA EM HORÁRIO DE BRASÍLIA
===================================================== */

function converterDataBrasilia(datetime) {

    /*
       A API retorna algo como:
       2026-11-26 11:13:00

       Acrescentamos o deslocamento de Brasília.
    */

    return new Date(
        datetime.replace(
            " ",
            "T"
        ) + "-03:00"
    );

}


/* =====================================================
   SOMENTE VELAS EFETIVAMENTE FECHADAS
===================================================== */

function filtrarVelasFechadas(candles) {

    const agora =
        new Date();


    return candles.filter(
        candle => {

            const inicioVela =
                converterDataBrasilia(
                    candle.datetime
                );


            if (
                Number.isNaN(
                    inicioVela.getTime()
                )
            ) {
                return false;
            }


            const fechamentoVela =
                new Date(
                    inicioVela.getTime() +
                    60000
                );


            return (
                fechamentoVela.getTime() <=
                agora.getTime()
            );

        }
    );

}


/* =====================================================
   EMA EM SÉRIE
===================================================== */

function calcularSerieEMA(
    valores,
    periodo
) {

    const resultado =
        new Array(
            valores.length
        ).fill(NaN);


    if (
        valores.length <
        periodo
    ) {
        return resultado;
    }


    let soma = 0;


    for (
        let i = 0;
        i < periodo;
        i++
    ) {

        soma += valores[i];

    }


    let ema =
        soma / periodo;


    resultado[
        periodo - 1
    ] = ema;


    const multiplicador =
        2 / (periodo + 1);


    for (
        let i = periodo;
        i < valores.length;
        i++
    ) {

        ema =
            (
                valores[i] -
                ema
            ) *
            multiplicador +
            ema;


        resultado[i] =
            ema;

    }


    return resultado;

}


/* =====================================================
   RSI EM SÉRIE
   Método Wilder, equivalente ao RMA
===================================================== */

function calcularSerieRSI(
    valores,
    periodo
) {

    const resultado =
        new Array(
            valores.length
        ).fill(NaN);


    if (
        valores.length <=
        periodo
    ) {
        return resultado;
    }


    let ganhos = 0;
    let perdas = 0;


    for (
        let i = 1;
        i <= periodo;
        i++
    ) {

        const diferenca =
            valores[i] -
            valores[i - 1];


        ganhos +=
            Math.max(
                diferenca,
                0
            );


        perdas +=
            Math.max(
                -diferenca,
                0
            );

    }


    let mediaGanhos =
        ganhos / periodo;


    let mediaPerdas =
        perdas / periodo;


    resultado[periodo] =
        mediaPerdas === 0
        ? 100
        : 100 -
          100 /
          (
              1 +
              mediaGanhos /
              mediaPerdas
          );


    for (
        let i = periodo + 1;
        i < valores.length;
        i++
    ) {

        const diferenca =
            valores[i] -
            valores[i - 1];


        const ganho =
            Math.max(
                diferenca,
                0
            );


        const perda =
            Math.max(
                -diferenca,
                0
            );


        mediaGanhos =
            (
                mediaGanhos *
                (periodo - 1) +
                ganho
            ) /
            periodo;


        mediaPerdas =
            (
                mediaPerdas *
                (periodo - 1) +
                perda
            ) /
            periodo;


        resultado[i] =
            mediaPerdas === 0
            ? 100
            : 100 -
              100 /
              (
                  1 +
                  mediaGanhos /
                  mediaPerdas
              );

    }


    return resultado;

}


/* =====================================================
   ATR EM SÉRIE
   Método Wilder, equivalente ao RMA
===================================================== */

function calcularSerieATR(
    candles,
    periodo
) {

    const resultado =
        new Array(
            candles.length
        ).fill(NaN);


    if (
        candles.length <=
        periodo
    ) {
        return resultado;
    }


    const trueRanges =
        new Array(
            candles.length
        ).fill(NaN);


    trueRanges[0] =
        candles[0].high -
        candles[0].low;


    for (
        let i = 1;
        i < candles.length;
        i++
    ) {

        const atual =
            candles[i];


        const fechamentoAnterior =
            candles[i - 1].close;


        trueRanges[i] =
            Math.max(

                atual.high -
                atual.low,

                Math.abs(
                    atual.high -
                    fechamentoAnterior
                ),

                Math.abs(
                    atual.low -
                    fechamentoAnterior
                )

            );

    }


    let soma = 0;


    for (
        let i = 0;
        i < periodo;
        i++
    ) {

        soma +=
            trueRanges[i];

    }


    let atr =
        soma / periodo;


    resultado[
        periodo - 1
    ] = atr;


    for (
        let i = periodo;
        i < trueRanges.length;
        i++
    ) {

        atr =
            (
                atr *
                (periodo - 1) +
                trueRanges[i]
            ) /
            periodo;


        resultado[i] =
            atr;

    }


    return resultado;

}


/* =====================================================
   MÉDIA SIMPLES DOS CORPOS
===================================================== */

function calcularMediaCorpos(
    candles,
    indice,
    periodo
) {

    const inicio =
        indice -
        periodo +
        1;


    if (inicio < 0) {
        return NaN;
    }


    let soma = 0;


    for (
        let i = inicio;
        i <= indice;
        i++
    ) {

        soma +=
            Math.abs(
                candles[i].close -
                candles[i].open
            );

    }


    return soma / periodo;

}


/* =====================================================
   HORÁRIO BRASÍLIA
===================================================== */

function obterPartesBrasilia(data) {

    const partes =
        new Intl.DateTimeFormat(
            "pt-BR",
            {
                timeZone:
                    "America/Sao_Paulo",

                year:
                    "numeric",

                month:
                    "2-digit",

                day:
                    "2-digit",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hour12:
                    false
            }
        ).formatToParts(data);


    const resultado = {};


    for (
        const parte of partes
    ) {

        if (
            parte.type !==
            "literal"
        ) {

            resultado[
                parte.type
            ] =
                Number(
                    parte.value
                );

        }

    }


    return resultado;

}


/* =====================================================
   PROCESSAR V6
===================================================== */

function processarV6(candles) {

    const fechamentos =
        candles.map(
            candle =>
                candle.close
        );


    const serieEma9 =
        calcularSerieEMA(
            fechamentos,
            CONFIG.emaRapidaPeriodo
        );


    const serieEma21 =
        calcularSerieEMA(
            fechamentos,
            CONFIG.emaLentaPeriodo
        );


    const serieRsi =
        calcularSerieRSI(
            fechamentos,
            CONFIG.rsiPeriodo
        );


    const serieAtr =
        calcularSerieATR(
            candles,
            CONFIG.atrPeriodo
        );


    const indice =
        candles.length - 1;


    const vela =
        candles[indice];


    const ema9 =
        serieEma9[indice];


    const ema21 =
        serieEma21[indice];


    const rsi =
        serieRsi[indice];


    const atr =
        serieAtr[indice];


    const indiceInclinacao =
        indice -
        CONFIG.periodoInclinacao;


    if (
        indiceInclinacao < 0 ||
        !Number.isFinite(
            serieEma9[
                indiceInclinacao
            ]
        )
    ) {

        throw new Error(
            "Histórico insuficiente para calcular a inclinação."
        );

    }


    const mediaCorpo =
        calcularMediaCorpos(
            candles,
            indice,
            CONFIG.mediaCorpoPeriodo
        );


    const corpo =
        Math.abs(
            vela.close -
            vela.open
        );


    const distanciaEMAs =
        Math.abs(
            ema9 -
            ema21
        );


    /* Tendência */

    const tendenciaAlta =
        ema9 > ema21;


    const tendenciaBaixa =
        ema9 < ema21;


    const emaRapidaSubindo =
        ema9 >
        serieEma9[
            indiceInclinacao
        ];


    const emaRapidaCaindo =
        ema9 <
        serieEma9[
            indiceInclinacao
        ];


    /* Lateralização */

    const mercadoComTendencia =
        distanciaEMAs >=
        atr *
        CONFIG.distanciaMinimaATR;


    /* Corpo da vela */

    const velaAlta =
        vela.close >
        vela.open &&

        corpo >
        mediaCorpo &&

        corpo >=
        atr *
        CONFIG.corpoMinimoATR;


    const velaBaixa =
        vela.close <
        vela.open &&

        corpo >
        mediaCorpo &&

        corpo >=
        atr *
        CONFIG.corpoMinimoATR;


    /* Posição do preço */

    const precoAcimaMedias =
        vela.close >
        ema9 &&

        vela.close >
        ema21;


    const precoAbaixoMedias =
        vela.close <
        ema9 &&

        vela.close <
        ema21;


    /* RSI */

    const rsiCall =
        rsi >=
        CONFIG.callRsiMin &&

        rsi <=
        CONFIG.callRsiMax;


    const rsiPut =
        rsi >=
        CONFIG.putRsiMin &&

        rsi <=
        CONFIG.putRsiMax;


    /* Período prospectivo */

    const dataVela =
        converterDataBrasilia(
            vela.datetime
        );


    const partes =
        obterPartesBrasilia(
            dataVela
        );


    const depoisDoInicio =
        dataVela.getTime() >=
        CONFIG.inicioTeste.getTime();


    const dentroDoHorario =
        partes.hour >=
        CONFIG.horaInicial &&

        partes.hour <
        CONFIG.horaFinal;


    const testeAtivo =
        depoisDoInicio &&
        dentroDoHorario;


    /*
       Conta somente uma vez cada nova vela.
    */

    if (
        ultimaVelaProcessada !==
        vela.datetime
    ) {

        contadorVelas++;

        ultimaVelaProcessada =
            vela.datetime;

    }


    const podeDarSinal =
        indiceUltimoSinal === null ||

        contadorVelas -
        indiceUltimoSinal >=
        CONFIG.intervaloMinimo;


    /* Condições finais */

    const sinalCall =
        testeAtivo &&
        tendenciaAlta &&
        emaRapidaSubindo &&
        mercadoComTendencia &&
        velaAlta &&
        precoAcimaMedias &&
        rsiCall &&
        podeDarSinal;


    const sinalPut =
        testeAtivo &&
        tendenciaBaixa &&
        emaRapidaCaindo &&
        mercadoComTendencia &&
        velaBaixa &&
        precoAbaixoMedias &&
        rsiPut &&
        podeDarSinal;


    atualizarPainel(
        {
            vela,
            ema9,
            ema21,
            rsi,
            atr,
            testeAtivo,
            depoisDoInicio,
            dentroDoHorario,
            sinalCall,
            sinalPut
        }
    );


    if (sinalCall) {

        indiceUltimoSinal =
            contadorVelas;

        emitirSinal(
            "CALL",
            vela
        );

    }
    else if (sinalPut) {

        indiceUltimoSinal =
            contadorVelas;

        emitirSinal(
            "PUT",
            vela
        );

    }

}


/* =====================================================
   ATUALIZAR PAINEL
===================================================== */

function atualizarPainel(resultado) {

    const {
        vela,
        ema9,
        ema21,
        rsi,
        atr,
        testeAtivo,
        depoisDoInicio,
        dentroDoHorario,
        sinalCall,
        sinalPut
    } = resultado;


    elemento("ema9").innerText =
        ema9.toFixed(5);


    elemento("ema21").innerText =
        ema21.toFixed(5);


    elemento("rsi").innerText =
        rsi.toFixed(2);


    elemento("atr").innerText =
        atr.toFixed(5);


    elemento("preco").innerText =
        vela.close.toFixed(5);


    elemento(
        "ultimaAtualizacao"
    ).innerText =
        vela.datetime +
        " • vela fechada";


    if (sinalCall) {

        definirStatus(
            "CALL",
            "#46e68b"
        );

        return;
    }


    if (sinalPut) {

        definirStatus(
            "PUT",
            "#ff5f67"
        );

        return;
    }


    if (!depoisDoInicio) {

        definirStatus(
            "AGUARDANDO INÍCIO",
            "#f2b84b"
        );

        return;
    }


    if (!dentroDoHorario) {

        definirStatus(
            "FORA DO HORÁRIO",
            "#f2b84b"
        );

        return;
    }


    if (testeAtivo) {

        definirStatus(
            "MONITORANDO",
            "#45a3ff"
        );

    }

}


/* =====================================================
   EMITIR SINAL
===================================================== */

function emitirSinal(
    direcao,
    vela
) {

    /*
       Evita repetir o mesmo alerta
       enquanto a API ainda retorna
       a mesma última vela.
    */

    const chaveAlerta =
        "v6_alerta_" +
        direcao +
        "_" +
        vela.datetime;


    if (
        sessionStorage.getItem(
            chaveAlerta
        )
    ) {
        return;
    }


    sessionStorage.setItem(
        chaveAlerta,
        "1"
    );


    /*
       Aviso sonoro simples.
       Se o navegador bloquear som,
       o painel visual continuará funcionando.
    */

    tocarAlerta();


    const mensagem =
        direcao +
        " confirmado no EUR/USD M1.\n\n" +
        "Entrada no início da próxima vela.\n" +
        "Expiração de 1 minuto.\n\n" +
        "Teste somente em conta DEMO.";


    setTimeout(
        () => alert(mensagem),
        100
    );

}


/* =====================================================
   SOM DO ALERTA
===================================================== */

function tocarAlerta() {

    try {

        const contexto =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        const oscilador =
            contexto.createOscillator();


        const ganho =
            contexto.createGain();


        oscilador.connect(
            ganho
        );


        ganho.connect(
            contexto.destination
        );


        oscilador.frequency.value =
            880;


        ganho.gain.value =
            0.08;


        oscilador.start();


        setTimeout(
            () => {

                oscilador.stop();

                contexto.close();

            },
            350
        );

    }
    catch (erro) {

        console.log(
            "Aviso sonoro bloqueado pelo navegador."
        );

    }

}


/* =====================================================
   STATUS VISUAL
===================================================== */

function definirStatus(
    texto,
    cor
) {

    elemento("status").innerText =
        texto;


    elemento("status").style.color =
        cor;

}


/* =====================================================
   ERROS
===================================================== */

function mostrarErro(mensagem) {

    elemento(
        "conexaoStatus"
    ).innerText =
        "ERRO: " +
        mensagem;


    elemento(
        "conexaoStatus"
    ).style.color =
        "#ff5f67";


    definirStatus(
        "SEM DADOS",
        "#ff5f67"
    );

}
