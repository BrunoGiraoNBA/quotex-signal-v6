<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V6 Signal | EUR/USD</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .painel {
      width: 90%;
      max-width: 700px;
      background: #101c2d;
      border: 1px solid #263852;
      border-radius: 18px;
      padding: 30px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      color: #45a3ff;
    }

    .subtitulo {
      color: #91a4bd;
      margin-bottom: 30px;
    }

    .mercado {
      font-size: 28px;
      font-weight: bold;
    }

    .timeframe {
      margin-top: 6px;
      color: #91a4bd;
    }

    .sinal {
      margin: 30px 0;
      padding: 30px 10px;
      background: #17263a;
      border-radius: 15px;
    }

    #status {
      font-size: 42px;
      font-weight: bold;
      color: #aab7c7;
    }

    .indicadores {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .indicador {
      background: #17263a;
      padding: 15px;
      border-radius: 10px;
    }

    .nome {
      color: #8296af;
      font-size: 13px;
    }

    .valor {
      margin-top: 6px;
      font-weight: bold;
      font-size: 18px;
    }

    .rodape {
      margin-top: 25px;
      color: #647891;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="painel">

    <h1>V6 SIGNAL</h1>

    <div class="subtitulo">
      Painel experimental de sinais
    </div>

    <div class="mercado">
      EUR/USD
    </div>

    <div class="timeframe">
      M1 • Entrada na próxima vela
    </div>

    <div class="sinal">
      <div id="status">AGUARDANDO DADOS</div>
    </div>

    <div class="indicadores">

      <div class="indicador">
        <div class="nome">EMA 9</div>
        <div class="valor" id="ema9">--</div>
      </div>

      <div class="indicador">
        <div class="nome">EMA 21</div>
        <div class="valor" id="ema21">--</div>
      </div>

      <div class="indicador">
        <div class="nome">RSI 14</div>
        <div class="valor" id="rsi">--</div>
      </div>

      <div class="indicador">
        <div class="nome">ATR 14</div>
        <div class="valor" id="atr">--</div>
      </div>

    </div>

    <div class="rodape">
      V6 • DEMO • Nenhuma operação é executada automaticamente
    </div>

  </div>

</body>
</html>
